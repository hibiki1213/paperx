; PaperX e-ink dashboard firmware
; Board: Seeed XIAO ESP32-S3 (PLUS)  /  framework: Arduino

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
; XIAO ESP32-S3 PLUS は 16MB フラッシュ。PlatformIO の board 定義は既定 8MB なので明示上書き。
; （8MB のままだと default_16MB.csv の app1/spiffs がフラッシュ範囲外になり、
;   2nd-stage bootloader が検証に失敗して起動直後にリセットを繰り返す＝boot loop）
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB
; 無線OTA(HTTPUpdate)に必要な 2スロット構成。app0/app1 各6.5MB・nvs は 0x9000 のまま
; （WiFiManager のWi-Fi資格情報は NVS に残るので、原則そのまま引き継がれる）。
board_build.partitions = default_16MB.csv
; XIAO ESP32-S3 uses native USB-CDC for Serial — route stdout over USB
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; キャプティブポータルの文字列を日本語版に差し替え（include/wm_strings_ja.h）
    ; WiFiManager(ライブラリ)からも見えるよう include/ を明示的に検索パスへ
    -I "${platformio.include_dir}"
    -DWM_STRINGS_FILE=\"wm_strings_ja.h\"

lib_deps =
    zinggjm/GxEPD2
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
    olikraus/U8g2_for_Adafruit_GFX
    tzapu/WiFiManager
    bblanchon/ArduinoJson
    ricmoo/QRCode
