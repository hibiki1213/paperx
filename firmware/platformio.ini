; PaperX e-ink dashboard firmware
; Board: Seeed XIAO ESP32-S3 (PLUS)  /  framework: Arduino

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
; XIAO ESP32-S3 uses native USB-CDC for Serial — route stdout over USB
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; キャプティブポータルの文字列を日本語版に差し替え（include/wm_strings_ja.h）
    ; WiFiManager(ライブラリ)からも見えるよう include/ を明示的に検索パスへ
    -I "${platformio.include_dir}"
    -DWM_STRINGS_FILE=\"wm_strings_ja.h\"

lib_deps =
    zinggjm/GxEPD2
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
    olikraus/U8g2_for_Adafruit_GFX
    tzapu/WiFiManager
    bblanchon/ArduinoJson
